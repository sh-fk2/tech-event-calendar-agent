AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Tech Event Calendar Auto-Registration Agent — polls Gmail for event
  reservation-confirmation emails, extracts structured event details with
  Amazon Bedrock, and registers the event on a personal Google Calendar
  (full details), optionally inviting one or more attendee addresses (e.g.
  a company Outlook mailbox) so they receive a standard calendar invite.

Parameters:
  ScheduleExpression:
    Type: String
    Default: "rate(3 hours)"
    Description: How often the poller Lambda runs.
  BedrockModelId:
    Type: String
    Default: "amazon.nova-lite-v1:0"
  GmailSenderAllowlist:
    Type: String
    Default: "peatix.com,techplay.jp,doorkeeper.jp,eventbrite.com"
    Description: >
      connpass.com is intentionally excluded from the default — connpass
      events are handled via the ConnpassIcsSecret feed instead. See the
      README's migration notes before adding connpass.com back here, since
      running both paths at once for connpass can double-register events.
  GmailKeywords:
    Type: String
    Default: "予約が完了しました,登録が完了しました,confirmation,registration confirmed"
  GmailSearchWindow:
    Type: String
    Default: "newer_than:3d"
  ConfidenceThreshold:
    Type: String
    Default: "0.6"
  DefaultDurationMinutes:
    Type: String
    Default: "120"
  PersonalCalendarId:
    Type: String
    Default: "primary"
  AttendeeEmails:
    Type: String
    Default: ""
    Description: >
      Optional comma-separated list of attendee addresses (e.g. a company
      Outlook mailbox) added to each personal calendar event; triggers a
      standard calendar invite email. Leave empty to skip.
  EventVisibility:
    Type: String
    Default: "default"
    AllowedValues: ["default", "private"]
    Description: >
      Google Calendar visibility for the created event. "private" hides the
      event's details from other people who have viewing access to this
      calendar (e.g. coworkers with shared-calendar visibility), while still
      showing full details to anyone directly invited via AttendeeEmails.
  DryRun:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
  PersonalGoogleAccountEmail:
    Type: String
    Description: >
      The personal Gmail address this agent operates on. ReauthFunction
      refuses to overwrite PersonalGoogleSecret unless the Google account
      that completes the browser consent flow matches this address exactly.
  AlarmNotificationEmail:
    Type: String
    Default: "carpe.diem.awsome@gmail.com"
    Description: >
      Address that receives an alert email when PollerFunction fails (e.g.
      Google OAuth refresh token expiry). Subscription must be confirmed via
      the link in the confirmation email after deploy.
  AlarmPeriodSeconds:
    Type: Number
    Default: 10800
    Description: >
      CloudWatch Alarm evaluation period, in seconds. Should roughly match
      ScheduleExpression so one poll failure triggers one alarm evaluation.

Globals:
  Function:
    Runtime: python3.12
    Timeout: 90
    MemorySize: 256

Resources:
  ProcessedEmailsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: gmail_message_id
          AttributeType: S
      KeySchema:
        - AttributeName: gmail_message_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  PersonalGoogleSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: tech-event-agent/google-personal
      Description: >
        Personal Google OAuth client + refresh token (gmail.readonly +
        calendar.events). Placeholder values — overwritten by
        scripts/generate_refresh_token.py after the one-time OAuth consent
        flow.
      SecretString: '{"client_id":"REPLACE_ME","client_secret":"REPLACE_ME","refresh_token":"REPLACE_ME","token_uri":"https://oauth2.googleapis.com/token"}'

  ConnpassIcsSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: tech-event-agent/connpass-ics
      Description: >
        connpass's personal "joined events" iCalendar subscription URL
        (webcal://connpass.com/joinmanage/<token>.ics), available from your
        connpass account settings. Leave the SecretString as REPLACE_ME (or
        don't populate it) to skip connpass ICS-based sync entirely — in
        that case connpass events keep flowing through the Gmail+Bedrock
        path as long as connpass.com remains in GmailSenderAllowlist.
      SecretString: "REPLACE_ME"

  PollerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: app.lambda_handler
      Environment:
        Variables:
          DDB_TABLE_NAME: !Ref ProcessedEmailsTable
          SECRET_NAME_PERSONAL_GOOGLE: !Ref PersonalGoogleSecret
          SECRET_NAME_CONNPASS_ICS: !Ref ConnpassIcsSecret
          PERSONAL_CALENDAR_ID: !Ref PersonalCalendarId
          ATTENDEE_EMAILS: !Ref AttendeeEmails
          EVENT_VISIBILITY: !Ref EventVisibility
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          GMAIL_SENDER_ALLOWLIST: !Ref GmailSenderAllowlist
          GMAIL_KEYWORDS: !Ref GmailKeywords
          GMAIL_SEARCH_WINDOW: !Ref GmailSearchWindow
          CONFIDENCE_THRESHOLD: !Ref ConfidenceThreshold
          DEFAULT_DURATION_MINUTES: !Ref DefaultDurationMinutes
          DRY_RUN: !Ref DryRun
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProcessedEmailsTable
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Ref PersonalGoogleSecret
                - !Ref ConnpassIcsSecret
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource: !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/*"

  PollerFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${PollerFunction}
      RetentionInDays: 14

  SchedulerInvocationRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokePollerFunction
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt PollerFunction.Arn

  PollerSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: tech-event-agent-poll
      ScheduleExpression: !Ref ScheduleExpression
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt PollerFunction.Arn
        RoleArn: !GetAtt SchedulerInvocationRole.Arn

  WebOAuthClientSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: tech-event-agent/web-oauth-client
      Description: >
        "Web application" type OAuth client (client_id + client_secret)
        created manually in Google Cloud Console for ReauthFunction. Must
        NOT be the same client as the "Desktop app" one used by
        scripts/generate_refresh_token.py — Google requires a Web
        application client for a fixed HTTPS redirect URI. Register the
        ReauthFunctionUrl output as an authorized redirect URI on this
        client before using it.
      SecretString: '{"client_id":"REPLACE_ME","client_secret":"REPLACE_ME"}'

  ReauthSharedSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: tech-event-agent/reauth-shared-secret
      Description: >
        Auto-generated bearer token gating ReauthFunctionUrl. Append it as
        ?key=<this value> to the start URL — treat the resulting bookmark
        like a password.
      GenerateSecretString:
        ExcludePunctuation: true
        PasswordLength: 48

  ReauthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: reauth_app.lambda_handler
      # Public, unauthenticated Function URL — cap concurrency so an
      # anonymous scanner hammering the endpoint can't run up the bill.
      ReservedConcurrentExecutions: 2
      FunctionUrlConfig:
        AuthType: NONE
      Environment:
        Variables:
          SECRET_NAME_PERSONAL_GOOGLE: !Ref PersonalGoogleSecret
          SECRET_NAME_WEB_OAUTH_CLIENT: !Ref WebOAuthClientSecret
          SECRET_NAME_SHARED_SECRET: !Ref ReauthSharedSecret
          EXPECTED_OWNER_EMAIL: !Ref PersonalGoogleAccountEmail
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Ref WebOAuthClientSecret
                - !Ref ReauthSharedSecret
            - Effect: Allow
              Action: secretsmanager:PutSecretValue
              Resource: !Ref PersonalGoogleSecret

  ReauthFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ReauthFunction}
      RetentionInDays: 14

  PollerAlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AWS::StackName}-poller-alarm"

  PollerAlarmSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref PollerAlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmNotificationEmail

  PollerErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-poller-errors"
      AlarmDescription: >
        PollerFunction failed at least once in the last poll cycle (e.g.
        Google OAuth refresh token expired). Open the ReauthFunctionUrl
        output on your phone to re-authorize, then check CloudWatch Logs if
        the failure persists.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref PollerFunction
      Statistic: Sum
      Period: !Ref AlarmPeriodSeconds
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref PollerAlarmTopic

Outputs:
  PollerFunctionName:
    Value: !Ref PollerFunction
  ProcessedEmailsTableName:
    Value: !Ref ProcessedEmailsTable
  PersonalGoogleSecretArn:
    Value: !Ref PersonalGoogleSecret
  ConnpassIcsSecretArn:
    Value: !Ref ConnpassIcsSecret
  PollerAlarmTopicArn:
    Value: !Ref PollerAlarmTopic
  ReauthFunctionUrl:
    Value: !GetAtt ReauthFunctionUrl.FunctionUrl
    Description: >
      Base URL for re-authorization. Visit "<this URL>?key=<ReauthSharedSecret
      value>" on your phone whenever PollerErrorAlarm fires.
  WebOAuthClientSecretArn:
    Value: !Ref WebOAuthClientSecret
  ReauthSharedSecretArn:
    Value: !Ref ReauthSharedSecret
